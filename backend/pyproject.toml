[project]
name = "rwa-diligenceai"
version = "0.1.0"
description = "Agentic document-verification system for RWA tokenization (verification and risk flagging only; never investment advice)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "anthropic>=0.34",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Heavy OCR dependency installed separately (make install-ocr) to keep dev envs light.
ocr = ["paddleocr>=2.7", "pdfplumber>=0.11"]
# Optional LLM providers; enable what you use.
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` in defaults is the idiomatic FastAPI pattern.
"app/api/**" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["app"]